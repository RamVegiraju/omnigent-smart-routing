# Omnigent SERVER config for smart routing.
# Loaded via:  omnigent server --config config.yaml   (run.sh does this)
#
# This `llm:` block enables the built-in ("oss") judge — no `routing:` block,
# no gateway. Docs: https://omnigent.ai/docs/build/routing
#
# Two separate connections, which do not share auth:
#   Coding harness : Claude Code on the Claude subscription. Routing picks
#                    among the subscription's models (claude-haiku-4-5,
#                    claude-sonnet-4-6, claude-opus-4-8, ...).
#   Judge          : the Databricks-served haiku below.
#
# A Claude subscription authenticates the coding harness only. The judge needs
# its own credential: _resolve_server_llm_connection (runtime/policies/builder.py)
# accepts `connection:` (base_url + api_key) or a Databricks `profile:`.
#
# The judge classifies each task (SIMPLE/MODERATE/COMPLEX, smart_routing.py:504)
# and picks a model; it does not do the coding, so keep it small and cheap.
# `model` is the only required field (spec/types.py LLMConfig); `profile` names
# a ~/.databrickscfg profile.
#
# ⚠️  SET `profile` TO YOUR OWN ~/.databrickscfg PROFILE BEFORE RUNNING.
#     Run `databricks auth login --host https://<workspace> --profile <name>`
#     first if the OAuth session has expired. Note that `profile` does NOT
#     support ${ENV_VAR} expansion — the parser expands env vars only inside
#     `connection:` / `api_key` / `base_url` (spec/parser.py:351, :738) — so
#     this has to be a literal profile name.
llm:
  model: databricks-claude-haiku-4-5
  profile: <your-databricks-profile>
